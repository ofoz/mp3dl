# ============================================================
# mp3.dbas.fun —— OpenResty 反向代理配置
#
# 用法（推荐走 1Panel 界面）：
#   1Panel → 网站 → 创建网站 → 域名 mp3.dbas.fun、类型「反向代理」
#   → 代理地址填 http://127.0.0.1:8080
#   → 网站设置 → HTTPS → 申请证书（Let's Encrypt）→ 开启强制 HTTPS
#   → 网站设置 → 配置文件 → 把本文件的 location / 段落覆盖上去
#
# 手动放置路径（以 1Panel 实际安装为准）：
#   /opt/1panel/apps/openresty/openresty/conf/conf.d/mp3.dbas.fun.conf
#
# 注意：SSL 证书、80→443 跳转、acme 验证段都由 1Panel 自动维护，
#       不要整段覆盖 1Panel 生成的配置，只替换 location 部分。
# ============================================================

server {
    listen 80;
    server_name mp3.dbas.fun;

    # —— 若手动部署（不用 1Panel），把下面几行取消注释并指向自己的证书 ——
    # listen 443 ssl http2;
    # ssl_certificate     /path/to/fullchain.pem;
    # ssl_certificate_key /path/to/privkey.pem;
    # ssl_protocols       TLSv1.2 TLSv1.3;
    # ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    # ssl_session_cache   shared:SSL:10m;
    # ssl_session_timeout 10m;

    access_log /opt/1panel/apps/openresty/openresty/log/mp3.dbas.fun.access.log;
    error_log  /opt/1panel/apps/openresty/openresty/log/mp3.dbas.fun.error.log warn;

    # 应用自身 MAX_CONTENT_LENGTH 是 2MB，这里放宽一档做兜底
    client_max_body_size 10m;

    # gzip 由 1Panel 全局配置控制；如需在此覆盖可取消注释
    # gzip on;
    # gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Host 必须传真实域名：后端用 request.host_url 生成下载直链和封面地址，
        # 传成 127.0.0.1 会让前端拿到指向本机的不可能访问的 URL。
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # 后端按「可信代理白名单 + 从右往左取第一个非代理 IP」解析，
        # 这里用 $proxy_add_x_forwarded_for 追加，不要用 $remote_addr 覆盖。
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # 后端 ProxyFix 只采信这个头来判断 is_secure（HTTPS 下 Cookie 才带 Secure）
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        # 关键：SSE 流式搜索（/api/search/stream）必须关缓冲，
        # 否则 nginx 会攒满一整块才吐给浏览器，进度条会「卡住然后一次性出现」。
        # 音频与 ZIP 大文件同样受益，避免落临时文件。
        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_cache             off;
        proxy_max_temp_file_size 0;

        # 单平台搜索实测 ~30s（多平台串行更久），ZIP 打包也可能超过 60s
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # 健康检查走独立路径，方便 1Panel 或外部探活，不打应用日志
    location = /healthz {
        proxy_pass http://127.0.0.1:8080/api/platforms;
        proxy_set_header Host $host;
        access_log off;
    }
}
