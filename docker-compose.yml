services:
  mp3dl:
    build:
      context: .
      dockerfile: Dockerfile
      # 构建容器走宿主网络：下面 services 里的 dns: 只对运行期容器生效，
      # 构建期用的是 dockerd 默认 DNS，在国内常被解析成 8.8.8.8 导致
      # pip 报 "Temporary failure in name resolution"。用 host 网络可绕开。
      network: host
    image: mp3dl:latest
    container_name: mp3dl
    restart: unless-stopped

    # 所有配置集中放 .env（与 README 的配置项同名），不写进 compose 文件
    env_file:
      - .env

    environment:
      TZ: Asia/Shanghai

    ports:
      # 只绑宿主回环，公网流量必须经 OpenResty 进来（终止 TLS、限流、日志）
      - "127.0.0.1:9080:9080"

    volumes:
      # 数据库、缓存音频、直链密钥、备份都在这里，务必持久化
      - ./storage:/app/mp3dl/storage

    dns:
      - 223.5.5.5
      - 119.29.29.29

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
